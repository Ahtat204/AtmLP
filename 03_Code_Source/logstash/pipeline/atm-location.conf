input {
file {
path => "/usr/share/logstash/pipeline/atm_location_lookup.csv"
start_position => "beginning"
sincedb_path => "/dev/null"
}
}
filter {
csv {
separator => ","
columns => ["LocationID","Location Name","No of ATMs","City","State","Country"]
}
}
output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "location"
}
}