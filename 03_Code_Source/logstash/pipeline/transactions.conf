input {
file {
path => "/usr/share/logstash/pipeline/atm_location_lookup.csv"
start_position => "beginning"
sincedb_path => "/dev/null"
}
}
filter {
csv {
separator => ","
columns => ["TransactionID","TransactionStartDateTime","TransactionEndDateTime","CardholderID","LocationID","TransactionTypeID","TransactionAmount"]
}
}
output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "transactions"
}
stdout {
codec => rubydebug
}
}