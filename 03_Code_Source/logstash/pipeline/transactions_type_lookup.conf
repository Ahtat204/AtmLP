input {
file {
path => "/usr/share/logstash/pipeline/transaction_type_lookup.csv.csv"
start_position => "beginning"
sincedb_path => "/dev/null"
}
}
filter {
csv {
separator => ","
columns => ["Hour_Key","Hour_Start_Time","Hour_End_Time"]
}
}
output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "type"
}
stdout {
codec => rubydebug
}
}