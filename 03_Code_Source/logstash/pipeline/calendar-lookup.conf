input {
file {
path => "/usr/share/logstash/pipeline/calendar_lookup.csv"
start_position => "beginning"
sincedb_path => "/dev/null"
}
}
filter {
csv {
separator => ","
columns => ["Date","Year","Month" ,"Name","Month","Quarter","Week of Year","End of Week","Day of Week","Day Name","IsHoliday"]
}
}
output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "calendar"
}
}