input {
file {
path => "/usr/share/logstash/pipeline/customers_lookup.csv"
start_position => "beginning"
sincedb_path => "/dev/null"
}
}
filter {
csv {
separator => ","
columns => ["CardholderID","First Name","Last Name","Gender","ATMID","Birth Date","Occupation","AccountType","IsWisabi"]
}
}
output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "customer"
}
}