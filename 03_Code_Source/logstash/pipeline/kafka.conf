input {
  kafka {
    bootstrap_servers => "${KAFKA_HOST}:9092"
    topics => ["${KAFKA_TOPIC}"]
    group_id => "logstash-es-consumer"
    codec => "json"
  }
}

filter {
  mutate {
    remove_field => ["@version"]
  }
}

output {
elasticsearch {
hosts => ["http://${ES_HOST}:9200"]
index => "kafka_transactions"
}
stdout {
codec => rubydebug
}
}
